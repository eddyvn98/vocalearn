name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - name: Probe pinned lexical database
        run: |
          npm run lexicon:install
          node scripts/probe-lexicon.js
      - name: Build offline manifest
        run: |
          npm run build:sw
          grep -q "const CACHE='vocalearn-0.1.0-" public/sw.js
