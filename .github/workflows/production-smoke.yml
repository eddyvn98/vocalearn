name: Production web smoke
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'server/main.js'
      - 'tests/browser_production_smoke.py'
      - 'tests/browser_production_exploratory.py'
      - 'tests/browser_production_autofill.py'
      - 'tests/browser_production_games.py'
      - '.github/workflows/production-smoke.yml'
      - 'docs/DELIVERY_WORKFLOW.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-web-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  production-web:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PRODUCTION_ORIGIN: https://vocalearn-web-production.up.railway.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install playwright==1.57.0 && python -m playwright install --with-deps chromium
      - name: Verify exact deployed commit on post-deploy rerun
        if: github.event_name == 'push' && github.run_attempt > 1
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          origin=os.environ["PRODUCTION_ORIGIN"].rstrip("/")
          expected=os.environ["EXPECTED_SHA"]
          with urllib.request.urlopen(origin+"/api/health",timeout=10) as response:
              data=json.load(response)
          actual=data.get("commit")
          if actual != expected:
              raise SystemExit(f"Production is serving {actual}, expected {expected}")
          print("Railway is serving exact rerun commit",expected)
          PY
      - name: Run smoke against Railway production URL
        run: python tests/browser_production_smoke.py
      - name: Run user-like exploratory journey against production
        run: python tests/browser_production_exploratory.py
      - name: Run real vocabulary through all MVP games
        run: python tests/browser_production_games.py
      - name: Verify shared dictionary autofill after deploy
        if: github.event_name == 'push' && github.run_attempt > 1
        run: python tests/browser_production_autofill.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-web-evidence
          path: |
            tests/browser-evidence/production-*.png
            tests/browser-evidence/production-exploratory-results.json
            tests/browser-evidence/production-game-*.png
            tests/browser-evidence/production-game-results.json
          if-no-files-found: ignore
          retention-days: 7
