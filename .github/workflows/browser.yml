name: Browser regression
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            browser: chromium
            viewport: 1280x900
          - os: ubuntu-latest
            browser: webkit
            viewport: 390x844
          - os: windows-latest
            browser: chromium
            viewport: 1280x900
          - os: macos-latest
            browser: webkit
            viewport: 1280x900
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - if: runner.os == 'Linux'
        run: python -m pip install playwright==1.57.0 && python -m playwright install --with-deps ${{ matrix.browser }}
      - if: runner.os != 'Linux'
        run: python -m pip install playwright==1.57.0 && python -m playwright install ${{ matrix.browser }}
      - name: Run actual browser regression
        env:
          PW_BROWSER: ${{ matrix.browser }}
          PW_VIEWPORT: ${{ matrix.viewport }}
        run: python tests/browser_e2e.py
      - name: Run timed/offline/multi-client acceptance
        if: matrix.os == 'ubuntu-latest' && matrix.browser == 'chromium' && matrix.viewport == '1280x900'
        env:
          PW_BROWSER: ${{ matrix.browser }}
        run: python tests/browser_acceptance_next.py
      - name: Run Excel import acceptance
        if: matrix.os == 'ubuntu-latest' && matrix.browser == 'chromium' && matrix.viewport == '1280x900'
        env:
          PW_BROWSER: ${{ matrix.browser }}
        run: python tests/browser_excel_import.py
      - name: Run browser navigation/contention acceptance
        if: matrix.os == 'ubuntu-latest' && matrix.browser == 'chromium' && matrix.viewport == '1280x900'
        env:
          PW_BROWSER: ${{ matrix.browser }}
        run: python tests/browser_navigation_contention.py
      - name: Run late-parent replay acceptance
        if: matrix.os == 'ubuntu-latest' && matrix.browser == 'chromium' && matrix.viewport == '1280x900'
        env:
          PW_BROWSER: ${{ matrix.browser }}
        run: python tests/browser_late_parent.py
      - name: Run study setup matrix acceptance
        if: matrix.os == 'ubuntu-latest' && matrix.browser == 'chromium' && matrix.viewport == '1280x900'
        env:
          PW_BROWSER: ${{ matrix.browser }}
        run: python tests/browser_study_setup.py
      - name: Run content-management acceptance
        if: matrix.os == 'ubuntu-latest' && matrix.browser == 'chromium' && matrix.viewport == '1280x900'
        env:
          PW_BROWSER: ${{ matrix.browser }}
        run: python tests/browser_content_management.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence-${{ matrix.os }}-${{ matrix.browser }}-${{ matrix.viewport }}
          path: tests/browser-evidence/
          if-no-files-found: ignore
          retention-days: 7
