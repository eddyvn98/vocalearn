name: Browser regression
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(github.event_name == 'pull_request' && '{"include":[{"os":"ubuntu-latest","browser":"chromium","viewport":"1280x900"}]}' || '{"include":[{"os":"ubuntu-latest","browser":"chromium","viewport":"1280x900"},{"os":"ubuntu-latest","browser":"webkit","viewport":"390x844"},{"os":"windows-latest","browser":"chromium","viewport":"1280x900"},{"os":"macos-latest","browser":"webkit","viewport":"1280x900"}]}') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm ci --ignore-scripts
      - run: npm run build:sw
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - if: runner.os == 'Linux'
        run: python -m pip install playwright==1.57.0 && python -m playwright install --with-deps ${{ matrix.browser }}
      - if: runner.os != 'Linux'
        run: python -m pip install playwright==1.57.0 && python -m playwright install ${{ matrix.browser }}
      - name: Run actual browser regression
        env:
          PW_BROWSER: ${{ matrix.browser }}
          PW_VIEWPORT: ${{ matrix.viewport }}
        run: python tests/browser_e2e.py
      - name: Run timed/offline/multi-client acceptance
        if: matrix.os == 'ubuntu-latest' && matrix.browser == 'chromium' && matrix.viewport == '1280x900'
        env:
          PW_BROWSER: ${{ matrix.browser }}
        run: python tests/browser_acceptance_next.py
      - name: Run Excel import acceptance
        if: matrix.os == 'ubuntu-latest' && matrix.browser == 'chromium' && matrix.viewport == '1280x900'
        env:
          PW_BROWSER: ${{ matrix.browser }}
        run: python tests/browser_excel_import.py
      - name: Run Excel compatibility acceptance
        if: matrix.os == 'ubuntu-latest' && matrix.browser == 'chromium' && matrix.viewport == '1280x900'
        env:
          PW_BROWSER: ${{ matrix.browser }}
        run: python tests/browser_excel_compat.py
      - name: Run session summary/error-book acceptance
        if: matrix.os == 'ubuntu-latest' && matrix.browser == 'chromium' && matrix.viewport == '1280x900'
        env:
          PW_BROWSER: ${{ matrix.browser }}
        run: python tests/browser_summary_errors.py
      - name: Run browser navigation/contention acceptance
        if: matrix.os == 'ubuntu-latest' && matrix.browser == 'chromium' && matrix.viewport == '1280x900'
        env:
          PW_BROWSER: ${{ matrix.browser }}
        run: python tests/browser_navigation_contention.py
      - name: Run late-parent replay acceptance
        if: matrix.os == 'ubuntu-latest' && matrix.browser == 'chromium' && matrix.viewport == '1280x900'
        env:
          PW_BROWSER: ${{ matrix.browser }}
        run: python tests/browser_late_parent.py
      - name: Run study setup matrix acceptance
        if: matrix.os == 'ubuntu-latest' && matrix.browser == 'chromium' && matrix.viewport == '1280x900'
        env:
          PW_BROWSER: ${{ matrix.browser }}
        run: python tests/browser_study_setup.py
      - name: Run card/topic/bulk acceptance
        if: matrix.os == 'ubuntu-latest' && matrix.browser == 'chromium' && matrix.viewport == '1280x900'
        env:
          PW_BROWSER: ${{ matrix.browser }}
        run: python tests/browser_card_management.py
      - name: Run media-store acceptance
        if: matrix.os == 'ubuntu-latest' && matrix.browser == 'chromium' && matrix.viewport == '1280x900'
        env:
          PW_BROWSER: ${{ matrix.browser }}
        run: python tests/browser_media_store.py
      - name: Run automated accessibility acceptance
        if: matrix.os == 'ubuntu-latest' && matrix.browser == 'chromium' && matrix.viewport == '1280x900'
        env:
          PW_BROWSER: ${{ matrix.browser }}
        run: python tests/browser_accessibility.py
      - name: Run Phase-2 Chinese acceptance
        if: matrix.os == 'ubuntu-latest' && matrix.browser == 'chromium' && matrix.viewport == '1280x900'
        run: python tests/browser_chinese.py
      - name: Run Phase-2 AI editor acceptance
        if: matrix.os == 'ubuntu-latest' && matrix.browser == 'chromium' && matrix.viewport == '1280x900'
        run: python tests/browser_ai.py
      - name: Run Phase-2 sentence pool acceptance
        if: matrix.os == 'ubuntu-latest' && matrix.browser == 'chromium' && matrix.viewport == '1280x900'
        run: python tests/browser_sentences.py
      - name: Run Phase-2 lookup editor acceptance
        if: matrix.os == 'ubuntu-latest' && matrix.browser == 'chromium' && matrix.viewport == '1280x900'
        run: python tests/browser_lookups.py
      - name: Run Phase-3 statistics acceptance
        if: matrix.os == 'ubuntu-latest' && matrix.browser == 'chromium' && matrix.viewport == '1280x900'
        run: python tests/browser_statistics.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence-${{ matrix.os }}-${{ matrix.browser }}-${{ matrix.viewport }}
          path: tests/browser-evidence/
          if-no-files-found: ignore
          retention-days: 7
