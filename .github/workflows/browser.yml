name: Browser regression
on:
  push:
    branches: [feature/core-hardening-mvp]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Package reproducible source snapshot
        run: git archive --format=zip --output=source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: source-snapshot
          path: source.zip
          retention-days: 1
      - run: npm ci --ignore-scripts
      - run: npm run build:sw
      - uses: actions/upload-artifact@v4
        with:
          name: generated-sw
          path: public/sw.js
          retention-days: 1
      - run: npm run verify
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - name: Browser E2E
        id: browser_e2e
        continue-on-error: true
        run: python tests/browser_e2e.py
      - name: Browser audio
        id: browser_audio
        continue-on-error: true
        run: python tests/browser_audio.py
      - name: Browser accessibility
        id: browser_accessibility
        continue-on-error: true
        run: python tests/browser_accessibility.py
      - name: Browser Chinese phase 2
        id: browser_chinese
        continue-on-error: true
        run: python tests/browser_chinese.py
      - name: Browser AI phase 2
        id: browser_ai
        continue-on-error: true
        run: python tests/browser_ai.py
      - name: Fail if any browser regression failed
        if: always()
        run: |
          test "${{ steps.browser_e2e.outcome }}" = "success"
          test "${{ steps.browser_audio.outcome }}" = "success"
          test "${{ steps.browser_accessibility.outcome }}" = "success"
          test "${{ steps.browser_chinese.outcome }}" = "success"
          test "${{ steps.browser_ai.outcome }}" = "success"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: tests/browser-evidence/
          if-no-files-found: ignore
          retention-days: 7
