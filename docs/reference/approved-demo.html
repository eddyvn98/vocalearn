<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VocaLearn · Bản xem trước</title>
<style>
:root{--bg:#f5f7fb;--ink:#18243a;--muted:#58677e;--line:#dce3ed;--blue:#2457db;--soft:#edf2ff;--green:#146442;--red:#ac2939}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select{font:inherit}button{cursor:pointer}button,input,select{border-radius:12px}button{min-height:44px}
button:disabled{cursor:not-allowed;opacity:.55}button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
input:focus{outline:3px solid #2457db33;border-color:var(--blue)}h1,h2,h3,p{margin:0}h1{font-size:32px;letter-spacing:-1px;line-height:1.25}
h2{font-size:20px;letter-spacing:-.4px}h3{font-size:17px}small,.small{font-size:13px}svg{width:20px;height:20px;flex-shrink:0;vertical-align:middle}
.muted{color:var(--muted)}.eyebrow{font-size:12px;font-weight:750;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted)}
.row{display:flex;align-items:center;gap:12px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.stack>*+*{margin-top:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:11px 18px;border:1px solid var(--line);background:white;color:var(--ink);font-weight:650;text-decoration:none}
.primary{background:var(--blue);border-color:var(--blue);color:white}.quiet{background:transparent}.danger{color:var(--red)}
.btn:hover:not(:disabled){filter:brightness(.97)}.icon-btn{width:44px;padding:0}.pill{display:inline-flex;align-items:center;gap:6px;border-radius:8px;padding:4px 9px;font-size:12px;font-weight:650;background:var(--soft);color:#254bb0}
.pill.warn{background:#fff3db;color:#815100}.pill.good{background:#e8f5ee;color:var(--green)}.pill.neutral{background:#eef1f5;color:var(--muted)}
.layout{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:100vh}.sidebar{background:white;border-right:1px solid var(--line);padding:28px 18px;display:flex;flex-direction:column;gap:34px}
.brand{font-weight:800;font-size:20px;letter-spacing:-.6px;gap:10px}.brand-mark{display:grid;place-items:center;background:var(--blue);color:white;width:36px;height:36px;border-radius:11px}
.nav{display:grid;gap:7px}.nav button{display:flex;align-items:center;gap:12px;background:transparent;border:0;padding:12px;text-align:left;color:var(--muted);font-weight:600}
.nav button.active{background:var(--soft);color:#234bb7}.demo-note{margin-top:auto;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:18px}
.topbar{height:76px;padding:0 36px;border-bottom:1px solid var(--line);background:#ffffffaa}.avatar{height:34px;width:34px;border-radius:50%;display:grid;place-items:center;background:#e9eef7;font-weight:700;font-size:13px}
main{max-width:1100px;margin:auto;padding:32px 36px 50px}.heading{margin-bottom:25px;align-items:flex-end}.heading p{margin-top:8px}
select,input{border:1px solid #9aa8bb;background:white;color:var(--ink);padding:10px 12px;min-height:44px;max-width:100%}
.scope{display:grid;gap:5px;min-width:200px}.scope label{font-size:12px;font-weight:650;color:var(--muted)}
.hero{display:flex;gap:24px;align-items:center;justify-content:space-between;padding:30px;background:linear-gradient(115deg,#edf2ff,#f9fbff);border:1px solid #cddafa;border-radius:22px}
.hero h2{font-size:29px;line-height:1.3;margin:12px 0 8px}.hero p{max-width:500px}.hero .actions{margin-top:23px}.hero-count{min-width:115px;text-align:center;color:#2457db}.hero-count strong{font-size:70px;line-height:1.1;letter-spacing:-4px;display:block}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:18px 0 26px}.metric{background:white;border:1px solid var(--line);padding:18px;text-align:left;display:flex;align-items:center;justify-content:space-between;color:var(--ink);border-radius:16px}
.metric strong{display:block;font-size:27px;line-height:1.3}.metric span{font-size:13px;color:var(--muted)}.columns{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.panel{background:white;border:1px solid var(--line);border-radius:18px;padding:23px}.panel>p{margin-top:5px}.practice{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:white;border:1px solid var(--line);padding:14px;color:var(--ink)}
.tile-icon{display:grid;place-items:center;width:44px;height:44px;background:var(--soft);border-radius:12px;color:var(--blue);flex-shrink:0}.practice>span:nth-child(2){flex:1}.practice small{display:block;color:var(--muted);font-weight:400}
.topic{width:100%;padding:13px 0;display:flex;align-items:center;justify-content:space-between;border:0;border-bottom:1px solid #edf0f5;border-radius:0;background:white;color:var(--ink);text-align:left}.topic:last-child{border-bottom:0}
.resume{margin-bottom:20px;padding:16px 20px;background:#fff7e7;border:1px solid #ecd69e;border-radius:14px}.toolbar{margin-bottom:18px}.searchbox{position:relative;flex:1;min-width:210px}.searchbox svg{position:absolute;left:14px;top:13px;color:var(--muted)}.searchbox input{width:100%;padding-left:43px}
.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:18px 0}.tabs button{padding:8px 13px;border:1px solid var(--line);background:white;color:var(--muted);font-size:13px;font-weight:650}.tabs button.active{background:var(--ink);border-color:var(--ink);color:white}
.word-list{background:white;border:1px solid var(--line);border-radius:16px;overflow:hidden}.wordrow{display:grid;grid-template-columns:1.1fr 1.2fr 1fr 44px;gap:16px;align-items:center;padding:17px 20px;border-bottom:1px solid var(--line)}.wordrow:last-child{border-bottom:0}.wordrow h3{font-size:16px;overflow-wrap:anywhere}.wordrow p{overflow-wrap:anywhere}.wordrow .status{display:flex;gap:6px;flex-wrap:wrap}
.empty{text-align:center;padding:44px 20px}.empty h2{margin-bottom:8px}
.study-shell{max-width:850px;margin:auto;padding:24px}.study-head{margin-bottom:24px}.study-meta{margin:0 0 10px}.bar{height:7px;background:#e0e7f1;border-radius:9px;overflow:hidden}.bar>span{display:block;height:100%;background:var(--blue);transition:width .2s}
.question{background:white;border:1px solid var(--line);border-radius:22px;padding:36px;margin-top:25px}.prompt{text-align:center;padding:15px 0 28px}.prompt h1{font-size:36px;margin:14px 0 7px;overflow-wrap:anywhere}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.answer{display:flex;align-items:center;gap:12px;border:1px solid #a8b5c9;background:white;padding:15px;text-align:left;color:var(--ink)}.answer b{font-size:13px;width:28px;height:28px;display:grid;place-items:center;border-radius:7px;background:#eef2f7;flex-shrink:0}
.answer:disabled{opacity:1}.answer.correct{border-color:#258258;background:#edf8f1}.answer.wrong{border-color:#bd3e51;background:#fff0f1}
.answer-input{width:100%;font-size:22px;padding:15px 17px;margin:8px 0}.answer-input[aria-invalid="true"]{border-color:var(--red)}.hint{padding:11px 14px;background:#fff7e7;color:#79511c;border-radius:10px;margin-bottom:13px}
.feedback{border-radius:14px;background:#edf8f1;border:1px solid #acd3bb;padding:19px;margin-top:22px}.feedback.bad{background:#fff0f1;border-color:#e5b4bb}.feedback h3{font-size:18px}.feedback p{margin-top:6px}.feedback .result-word{font-size:23px;font-weight:750}
.footnote{font-size:12px;text-align:center;color:var(--muted);margin-top:18px}.summary{text-align:center;max-width:650px;margin:48px auto}.summary .tile-icon{margin:0 auto 20px;width:62px;height:62px}.summary h1{margin-bottom:10px}.summary .metrics .metric{display:block;text-align:center}
dialog{border:1px solid var(--line);border-radius:20px;padding:26px;width:min(94vw,470px);color:var(--ink);box-shadow:0 24px 80px #16223c30}dialog::backdrop{background:#17233c66}dialog label{display:grid;gap:5px;font-size:14px;font-weight:650}dialog .fields{display:grid;gap:15px;margin:20px 0}dialog p{overflow-wrap:anywhere}.form-error{color:var(--red);font-size:13px}
#announcement{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);max-width:90vw;background:var(--ink);color:white;border-radius:12px;padding:12px 18px;z-index:5;font-size:14px}#announcement:empty{display:none}
@media(max-width:1020px){.layout{grid-template-columns:180px minmax(0,1fr)}main{padding:27px 24px}.topbar{padding:0 24px}.hero{padding:24px}.hero-count{display:none}.columns{grid-template-columns:1fr}.heading{align-items:flex-start}.wordrow{grid-template-columns:1fr 1fr .8fr 44px;gap:10px}}
@media(max-width:720px){.layout{display:block}.sidebar{padding:14px 18px;border-right:0;border-bottom:1px solid var(--line);gap:14px}.sidebar .brand{font-size:18px}.nav{display:flex;gap:5px}.nav button{flex:1;justify-content:center;padding:8px;font-size:13px}.demo-note{display:none}.topbar{height:58px;padding:0 18px}.topbar .environment{display:none}main{padding:24px 18px}.heading{display:block}.scope{margin-top:17px}.hero{padding:23px}.hero h2{font-size:26px}.hero .actions{align-items:stretch}.hero .actions .btn{flex:1}.metrics{gap:8px}.metric{padding:14px 10px}.metric svg{display:none}.metric strong{font-size:24px}.metric span{font-size:12px}.columns{gap:16px}.panel{padding:20px}.resume{align-items:flex-start;flex-wrap:wrap}.toolbar{flex-wrap:wrap}.searchbox{flex-basis:100%}.wordrow{grid-template-columns:1fr auto;padding:17px}.wordrow .meaning{grid-column:1;grid-row:2}.wordrow .status{grid-column:1;grid-row:3}.wordrow>button{grid-column:2;grid-row:1/4}.study-shell{padding:18px}.study-head .brand{font-size:17px}.question{padding:24px 18px}.prompt h1{font-size:30px}.answers{grid-template-columns:1fr}.summary{margin:25px auto}.summary .metrics{grid-template-columns:1fr}.summary .metric{display:flex;text-align:left}.study-meta{font-size:13px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<dialog id="modal" aria-labelledby="modal-title"></dialog>
<div id="announcement" role="status" aria-live="polite"></div>
<script>
"use strict";
const $=s=>document.querySelector(s), esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const paths={book:'M4 4h6a3 3 0 0 1 2 1 3 3 0 0 1 2-1h6v15h-6a3 3 0 0 0-2 1 3 3 0 0 0-2-1H4z M12 5v15',home:'m3 10 9-7 9 7 M5 9v12h14V9 M9 21v-8h6v8',list:'M8 6h13 M8 12h13 M8 18h13 M3 6h.01 M3 12h.01 M3 18h.01',flag:'M5 21V4 M5 4c5-4 9 4 14 0v10c-5 4-9-4-14 0',arrow:'M5 12h14 m-6-6 6 6-6 6',plus:'M12 5v14 M5 12h14',close:'m6 6 12 12 M6 18 18 6',search:'M21 21l-5-5 M18 10a8 8 0 1 1-16 0 8 8 0 0 1 16 0',check:'m5 12 4 4L19 6',keyboard:'M3 5h18v14H3z M7 9h.01 M11 9h.01 M15 9h.01 M7 13h.01 M11 13h.01 M15 13h.01 M8 16h8',pause:'M8 5v14 M16 5v14',back:'M19 12H5 m6-6-6 6 6 6'};
const icon=n=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[n]?`<path d="${paths[n]}"/>`:""}</svg>`;
const brand=()=>`<div class="row brand"><span class="brand-mark">${icon("book")}</span>VocaLearn</div>`;
const categories=["Công việc","Giao tiếp","Đời sống"];
const words=[
{id:1,word:"deploy",meaning:"triển khai ứng dụng",type:"Động từ",cat:"Công việc",phase:"review",due:true,ipa:"/dɪˈplɔɪ/",example:"We will deploy the app tomorrow."},
{id:2,word:"confirm",meaning:"xác nhận",type:"Động từ",cat:"Công việc",phase:"review",due:true,error:true,ipa:"/kənˈfɜːm/",example:"Please confirm the meeting time."},
{id:3,word:"deadline",meaning:"hạn chót",type:"Danh từ",cat:"Công việc",phase:"review",due:true,ipa:"/ˈded.laɪn/",example:"The deadline is Friday."},
{id:4,word:"improve",meaning:"cải thiện",type:"Động từ",cat:"Giao tiếp",phase:"review",due:true,ipa:"/ɪmˈpruːv/",example:"I want to improve my English."},
{id:5,word:"journey",meaning:"hành trình",type:"Danh từ",cat:"Đời sống",phase:"review",due:true,ipa:"/ˈdʒɜː.ni/",example:"We enjoyed the journey."},
{id:6,word:"curious",meaning:"tò mò",type:"Tính từ",cat:"Giao tiếp",phase:"review",due:true,error:true,ipa:"/ˈkjʊə.ri.əs/",example:"She is curious about the new app."},
{id:7,word:"reliable",meaning:"đáng tin cậy",type:"Tính từ",cat:"Giao tiếp",phase:"new",ipa:"/rɪˈlaɪ.ə.bəl/",example:"He is a reliable teammate."},
{id:8,word:"appointment",meaning:"cuộc hẹn",type:"Danh từ",cat:"Đời sống",phase:"new",ipa:"/əˈpɔɪnt.mənt/",example:"I have an appointment tomorrow."},
{id:9,word:"estimate",meaning:"ước tính",type:"Động từ",cat:"Công việc",phase:"new",ipa:"/ˈes.tɪ.meɪt/",example:"Can you estimate the cost?"},
{id:10,word:"opportunity",meaning:"",type:"Danh từ",cat:"Công việc",phase:"waiting"}
];
const state={page:"home",scope:"all",filter:"all",query:"",game:"mix",session:null};
const filters={all:"Tất cả",due:"Đến hạn",new:"Từ mới",error:"Sổ từ sai",waiting:"Chờ bổ sung"};
const modeName={review:"Ôn theo lịch",free:"Luyện tự do",errors:"Ôn sổ từ sai"};
const phaseName={review:"Đang ôn",new:"Mới",waiting:"Chờ bổ sung",relearn:"Học lại"};
const scoped=()=>words.filter(w=>state.scope==="all"||w.cat===state.scope);
const active=()=>state.session&&!state.session.finished;
const button=(label,action,cls="",extra="")=>`<button type="button" class="btn ${cls}" data-action="${action}" ${extra}>${label}</button>`;
const scopeControl=()=>`<div class="scope"><label for="scope">Phạm vi học</label><select id="scope"><option value="all">Tất cả chủ đề</option>${categories.map(c=>`<option ${state.scope===c?"selected":""}>${c}</option>`).join("")}</select></div>`;
let messageTimer;
function announce(text){$("#announcement").textContent=text;clearTimeout(messageTimer);messageTimer=setTimeout(()=>$("#announcement").textContent="",3500)}
function shell(content){return `<div class="layout"><aside class="sidebar">${brand()}<nav class="nav" aria-label="Điều hướng chính">${[["home","home","Hôm nay"],["library","list","Kho từ"],["errors","flag","Sổ từ sai"]].map(([a,i,t])=>`<button data-action="${a}" class="${(a==="home"&&state.page==="home")||(a==="library"&&state.page==="library"&&state.filter!=="error")||(a==="errors"&&state.page==="library"&&state.filter==="error")?"active":""}">${icon(i)}${t}</button>`).join("")}</nav><div class="demo-note"><strong>Bản xem trước tương tác</strong><p>Dữ liệu chỉ giữ trong phiên này. Tải lại trang để đặt lại.</p></div></aside><div><header class="topbar row between"><span class="pill neutral">${icon("book")} Anh → Việt</span><div class="row"><small class="muted environment">Không kết nối máy chủ</small><span class="pill neutral">DEMO</span><span class="avatar" aria-label="Tài khoản minh họa">V</span></div></header><main id="main">${content}</main></div></div>`}
function home(){
 const list=scoped(),due=list.filter(w=>w.due).length,n=list.filter(w=>w.phase==="new").length,err=list.filter(w=>w.error).length,wait=list.filter(w=>w.phase==="waiting").length;
 return shell(`<section class="heading row between"><div><div class="eyebrow">Mỗi ngày một chút</div><h1 tabindex="-1">Hôm nay học gì?</h1><p class="muted">Một buổi ôn ngắn, thêm một lần nhớ lâu.</p></div>${scopeControl()}</section>
 ${active()?`<div class="resume row between"><div><strong>Buổi học đang tạm dừng</strong><p class="small">${modeName[state.session.mode]} · Đã trả lời ${state.session.results.length}/${state.session.queue.length} thẻ</p></div><div class="row">${button("Tiếp tục","resume","primary")}${button("Kết thúc","finish","quiet")}</div></div>`:""}
 <section class="hero"><div><span class="pill">${due?"Ưu tiên hôm nay":"Đã xong lượt ôn mẫu"}</span><h2>${due?`${due} thẻ đang chờ bạn.`:"Bạn đã ôn hết từ đến hạn."}</h2><p class="muted">${due?"Ôn các thẻ đến hạn trong phạm vi đã chọn, rồi hãy học từ mới.":"Bạn có thể luyện thêm hoặc xem các từ mới trong kho."}</p><div class="row wrap actions"><label class="small" for="game">Kiểu ôn</label><select id="game" ${active()?"disabled":""}>${[["mix","Trộn 2 game"],["typing","Gõ từ"],["quiz","Trắc nghiệm"]].map(([v,t])=>`<option value="${v}" ${state.game===v?"selected":""}>${t}</option>`).join("")}</select>${button(`${active()?"Tiếp tục buổi học":due?"Bắt đầu ôn tập":"Xem từ mới"} ${icon("arrow")}`,active()?"resume":due?"review":"filter","primary",due||active()?"":'data-filter="new"')}</div></div><div class="hero-count"><strong>${String(due).padStart(2,"0")}</strong><small>THẺ ĐẾN HẠN</small></div></section>
 <div class="metrics">${[[n,"Từ mới","new"],[err,"Trong sổ từ sai","error"],[wait,"Chờ bổ sung","waiting"]].map(([v,t,f])=>`<button class="metric" data-action="filter" data-filter="${f}"><div><strong>${v}</strong><span>${t}</span></div>${icon("arrow")}</button>`).join("")}</div>
 <div class="columns"><section class="panel stack"><div><h2>Luyện tự do</h2><p class="muted small">Không thay đổi lịch ôn. Lỗi vẫn vào sổ từ sai.</p></div>${[["typing","keyboard","Gõ từ","Nhìn nghĩa → nhập từ tiếng Anh"],["quiz","list","Trắc nghiệm","Nhìn từ → chọn nghĩa đúng"]].map(([g,i,t,d])=>`<button class="practice" data-action="practice" data-game="${g}" ${active()?"disabled":""}><span class="tile-icon">${icon(i)}</span><span><strong>${t}</strong><small>${d}</small></span>${icon("arrow")}</button>`).join("")}${active()?'<p class="small muted">Kết thúc buổi đang dở trước khi luyện buổi mới.</p>':""}</section>
 <section class="panel"><h2>Chủ đề của bạn</h2><p class="muted small">Chọn để đổi phạm vi học.</p>${categories.map(c=>`<button class="topic" data-action="topic" data-topic="${c}"><span><strong>${c}</strong><br><small class="muted">${words.filter(w=>w.cat===c).length} thẻ</small></span><span class="pill ${words.some(w=>w.cat===c&&w.due)?"":"neutral"}">${words.filter(w=>w.cat===c&&w.due).length} đến hạn</span></button>`).join("")}</section></div><p class="footnote">Dữ liệu mẫu · Điểm và lịch ôn trong bản xem trước chỉ mang tính minh họa.</p>`);
}
function filtered(){return scoped().filter(w=>(state.filter==="all"||state.filter==="due"&&w.due||state.filter==="error"&&w.error||w.phase===state.filter)&&`${w.word} ${w.meaning} ${w.cat}`.toLocaleLowerCase("vi").includes(state.query.toLocaleLowerCase("vi").trim()))}
function wordList(){const list=filtered();return list.length?list.map(w=>`<article class="wordrow" aria-labelledby="word-${w.id}"><div><h3 id="word-${w.id}">${esc(w.word)}</h3><small class="muted">${esc(w.type)} · ${esc(w.cat)}</small></div><p class="meaning ${w.meaning?"":"muted"}">${esc(w.meaning||"Chưa có nghĩa")}</p><div class="status"><span class="pill ${w.phase==="waiting"?"warn":"neutral"}">${phaseName[w.phase]}</span>${w.due?'<span class="pill">Đến hạn</span>':""}${w.error?'<span class="pill warn">Từng sai</span>':""}</div>${button(icon("arrow"),"detail","icon-btn",`data-id="${w.id}" aria-label="Xem thẻ ${esc(w.word)}"`)}</article>`).join(""):`<div class="empty"><h2>Chưa có thẻ phù hợp</h2><p class="muted">Thử đổi bộ lọc, chủ đề hoặc thêm từ mới.</p></div>`}
function library(){return shell(`<section class="heading row between"><div><div class="eyebrow">Bộ học Anh → Việt</div><h1 tabindex="-1">${state.filter==="error"?"Sổ từ sai":"Kho từ của bạn"}</h1><p class="muted">Mỗi thẻ lưu một nghĩa cụ thể của từ.</p></div>${scopeControl()}</section><div class="toolbar row"><div class="searchbox">${icon("search")}<input id="search" aria-label="Tìm từ, nghĩa hoặc chủ đề" placeholder="Tìm từ, nghĩa hoặc chủ đề…" value="${esc(state.query)}"></div>${button(`${icon("plus")} Thêm từ`,"add","primary")}${state.filter==="error"?button("Luyện từ sai","error-practice","",scoped().some(w=>w.error&&w.meaning)&&!active()?"":"disabled"):""}</div><div class="tabs" aria-label="Bộ lọc thẻ">${Object.entries(filters).map(([f,t])=>`<button data-action="filter" data-filter="${f}" class="${state.filter===f?"active":""}" aria-pressed="${state.filter===f}">${t}</button>`).join("")}</div><p id="list-count" class="small muted" style="margin-bottom:12px">${filtered().length} thẻ trong phạm vi đã chọn</p><div class="word-list" id="word-list">${wordList()}</div><p class="footnote">Có thể thêm từ hoặc mở thẻ “Chờ bổ sung” để nhập nghĩa. Thay đổi mất khi tải lại trang.</p>`)}
function choicesFor(w){const candidates=words.filter(x=>x.id!==w.id&&x.meaning&&x.meaning!==w.meaning).sort((a,b)=>(b.type===w.type)-(a.type===w.type));const unique=[...new Map(candidates.map(x=>[x.meaning,x])).values()].slice(0,3);return [w,...unique].sort((a,b)=>((a.id*7+w.id)%13)-((b.id*7+w.id)%13)).map(x=>({id:x.id,label:x.meaning}))}
function start(mode,game){
 if(active()){announce("Hãy tiếp tục hoặc kết thúc buổi học đang dở.");return}
 const pool=scoped().filter(w=>w.meaning&&(mode==="review"?w.due:mode==="errors"?w.error:true));
 if(!pool.length){announce("Chưa có thẻ đủ điều kiện trong phạm vi này.");return}
 state.session={mode,queue:pool.map((w,i)=>({word:{...w},game:game==="mix"?(i%2?"typing":"quiz"):game,choices:choicesFor(w),answer:"",hint:false,retry:false,hadError:false,result:null})),i:0,results:[],finished:false};
 state.page="study";window.scrollTo(0,0);render(current().game==="typing"?"#answer":".prompt h1");
}
const current=()=>state.session.queue[state.session.i];
function study(){
 const s=state.session,q=current(),w=q.word,done=s.results.length;
 return `<div class="study-shell"><header class="study-head row between">${brand()}${button(`${icon("pause")} Tạm dừng`,"home","quiet")}</header><div class="study-meta row between wrap"><span class="pill ${s.mode==="review"?"":"neutral"}">${modeName[s.mode]} · ${q.game==="typing"?"Gõ từ":"Trắc nghiệm"}</span><span class="muted">${done}/${s.queue.length} đã trả lời</span></div><div class="bar" role="progressbar" aria-label="Tiến độ buổi học" aria-valuemin="0" aria-valuemax="${s.queue.length}" aria-valuenow="${done}"><span style="width:${done/s.queue.length*100}%"></span></div>
 <section class="question"><div class="prompt"><span class="eyebrow">Câu ${s.i+1} · ${esc(w.type)}</span><h1 tabindex="-1">${esc(q.game==="typing"?w.meaning:w.word)}</h1><p class="muted">${q.game==="typing"?"Nhìn nghĩa và nhập từ tiếng Anh tương ứng.":"Chọn nghĩa tiếng Việt đúng của từ này."}</p></div>
 ${q.game==="quiz"?`<div class="answers">${q.choices.map((a,i)=>`<button class="answer ${q.result?(a.id===w.id?"correct":String(a.id)===q.answer?"wrong":""):""}" data-action="choose" data-id="${a.id}" ${q.result?"disabled":""}><b>${"ABCD"[i]}</b><span>${esc(a.label)}</span>${q.result&&a.id===w.id?icon("check"):""}</button>`).join("")}</div>`:
 `<form id="answer-form"><label for="answer" class="small"><strong>Từ tiếng Anh</strong></label><input class="answer-input" id="answer" value="${esc(q.answer)}" autocomplete="off" spellcheck="false" autocapitalize="none" placeholder="Nhập đáp án…" aria-describedby="typing-note" aria-invalid="${q.retry&&!q.result}" ${q.result?"disabled":""}><p id="typing-note" class="small ${q.retry&&!q.result?"danger":"muted"}">${q.retry&&!q.result?"Sai 1 ký tự. Kiểm tra từ vị trí "+q.position+" và sửa lại một lần.":"Không phân biệt chữ hoa và chữ thường."}</p>${q.hint?`<div class="hint" style="margin-top:14px">Gợi ý: ${esc(w.ipa||`bắt đầu bằng “${w.word[0]}”`)}. Kết quả tối đa: Khó.</div>`:""}${!q.result?`<div class="row between wrap" style="margin-top:20px">${button("Gợi ý","hint","quiet",q.hint?"disabled":"")}<button class="btn primary" type="submit">Kiểm tra ${icon("arrow")}</button></div>`:""}</form>`}
 ${q.result?`<section class="feedback ${q.result.ok?"":"bad"}" id="feedback" tabindex="-1" aria-label="Kết quả"><div class="row between"><h3>${q.result.ok?(q.hadError?"Đúng sau khi sửa":q.hint?"Đúng với gợi ý":"Chính xác!"):"Chưa đúng, cùng ghi nhớ lại."}</h3><span class="pill ${q.result.ok?"good":"warn"}">${q.result.grade}</span></div><p class="result-word">${esc(w.word)} <span class="muted" style="font-size:16px;font-weight:400">— ${esc(w.meaning)}</span></p>${w.example?`<p class="small">${esc(w.example)}</p>`:""}<p class="small muted">${q.result.reason}</p><div class="row between wrap" style="margin-top:17px"><small>${s.mode==="review"?"Mô phỏng: cập nhật lịch ôn":"Chỉ luyện tập · không đổi lịch"}</small>${button(`${s.i===s.queue.length-1?"Xem kết quả":"Câu tiếp theo"} ${icon("arrow")}`,"next","primary")}</div></section>`:""}</section><p class="footnote">DEMO · Chấm điểm minh họa, chưa chạy thuật toán ôn đầy đủ.<br>Thay đổi chỉ giữ trong phiên xem trước.</p></div>`;
}
const normalize=s=>s.normalize("NFC").trim().replace(/\s+/g," ").toLowerCase();
function distance(a,b){const row=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){let prev=row[0];row[0]=i;for(let j=1;j<=b.length;j++){const old=row[j];row[j]=Math.min(row[j]+1,row[j-1]+1,prev+(a[i-1]!==b[j-1]));prev=old}}return row[b.length]}
function markError(q){q.hadError=true;words.find(w=>w.id===q.word.id).error=true}
function submit(answer){
 const s=state.session,q=current();if(q.result)return;q.answer=answer;
 if(q.game==="typing"&&!answer.trim()){announce("Nhập đáp án trước khi kiểm tra.");$("#answer").focus();return}
 const ok=q.game==="quiz"?Number(answer)===q.word.id:normalize(answer)===normalize(q.word.word);
 if(!ok&&q.game==="typing"&&!q.retry&&distance(normalize(answer),normalize(q.word.word))===1){markError(q);q.retry=true;let p=0;while(normalize(answer)[p]===normalize(q.word.word)[p]&&p<normalize(answer).length)p++;q.position=p+1;render("#answer");announce("Gần đúng. Bạn được sửa lại một lần.");return}
 if(!ok)markError(q);const grade=!ok?"Quên":q.game==="quiz"||q.hint||q.hadError?"Khó":"Tốt";
 q.result={ok,grade,reason:!ok?"Đáp án đã được hiện để bạn ghi nhớ. Thẻ được đưa vào sổ từ sai.":q.hadError?"Bạn đã sửa đúng. Lỗi trước đó vẫn được ghi nhận trong sổ từ sai.":q.hint?"Có dùng gợi ý nên kết quả tối đa là Khó.":q.game==="quiz"?"Trắc nghiệm kiểm tra khả năng nhận ra, nên mức tối đa là Khó.":"Bạn nhớ lại và gõ đúng ngay lần đầu."};s.results.push({ok,clean:ok&&!q.hadError&&!q.hint,error:q.hadError});
 if(s.mode==="review"){const original=words.find(w=>w.id===q.word.id);original.due=false;if(!ok)original.phase="relearn"}
 render("#feedback");
}
function summary(){const s=state.session,n=s.results.length;return shell(`<section class="summary"><span class="tile-icon">${icon("check")}</span><span class="pill good">${n===s.queue.length?"Hoàn thành buổi học":"Buổi học đã kết thúc"}</span><h1 tabindex="-1" style="margin-top:16px">Thêm một lần ghi nhớ.</h1><p class="muted">${modeName[s.mode]} · ${n}/${s.queue.length} thẻ đã trả lời</p><div class="metrics">${[[n,"Đã trả lời"],[s.results.filter(r=>r.clean).length,"Đúng ngay, không gợi ý"],[s.results.filter(r=>r.error).length,"Có lỗi, cần luyện thêm"]].map(([v,t])=>`<div class="metric"><strong>${v}</strong><span>${t}</span></div>`).join("")}</div><p class="muted small">${s.mode==="review"?"Các thẻ đã trả lời được bỏ khỏi nhóm Đến hạn trong demo. Thẻ sai chuyển sang Học lại; lịch 10 phút chưa được mô phỏng.":"Lịch ôn không thay đổi. Các lần trả lời sai được thêm vào sổ từ sai."}</p><div class="row wrap" style="justify-content:center;margin-top:26px">${button("Về Hôm nay","home","primary")}${button("Mở sổ từ sai","errors")}</div><p class="footnote">Đây là dữ liệu minh họa, không được đồng bộ hoặc lưu sau khi tải lại.</p></section>`)}
function render(focus){$("#app").innerHTML=state.page==="study"?study():state.page==="summary"?summary():state.page==="library"?library():home();if(focus)requestAnimationFrame(()=>$(focus)?.focus())}
function navigate(page,filter){window.scrollTo(0,0);if(state.session?.finished)state.session=null;state.page=page;if(filter){state.filter=filter;state.query=""}render(page==="study"?(current().result?"#feedback":current().game==="typing"?"#answer":".prompt h1"):"h1")}
function finish(){window.scrollTo(0,0);state.session.finished=true;state.page="summary";render("h1")}
function openModal(content){$("#modal").innerHTML=`<div class="row between"><h2 id="modal-title">Thẻ từ</h2>${button(icon("close"),"close","icon-btn quiet",'aria-label="Đóng"')}</div>${content}`;$("#modal").showModal()}
function addModal(){openModal(`<p class="muted small" style="margin-top:8px">Một thẻ ứng với một nghĩa. Bỏ trống nghĩa sẽ lưu vào Chờ bổ sung.</p><form id="add-form"><div class="fields"><label>Từ tiếng Anh<input name="word" required maxlength="80" autocomplete="off" placeholder="Ví dụ: collaborate" autofocus></label><label>Nghĩa tiếng Việt<input name="meaning" maxlength="200" placeholder="Ví dụ: cộng tác"></label><div class="row"><label style="flex:1">Loại từ<select name="type">${["Động từ","Danh từ","Tính từ","Cụm từ"].map(t=>`<option>${t}</option>`).join("")}</select></label><label style="flex:1">Chủ đề<select name="cat">${categories.map(c=>`<option ${state.scope===c?"selected":""}>${c}</option>`).join("")}</select></label></div></div><p class="form-error" id="form-error" role="status"></p><div class="row between" style="margin-top:20px">${button("Hủy","close","quiet")}<button class="btn primary" type="submit">Lưu thẻ trong demo</button></div></form>`);$("#modal-title").textContent="Thêm từ mới"}
function detail(id){const w=words.find(x=>x.id===id);openModal(`<div class="stack" style="margin-top:18px"><div><h1>${esc(w.word)}</h1><p class="muted">${esc(w.ipa||w.type)}</p></div><p>${esc(w.meaning||"Chưa có nghĩa tiếng Việt.")}</p><span class="pill neutral">${esc(w.cat)} · ${phaseName[w.phase]}</span>${w.example?`<p class="small">${esc(w.example)}</p>`:""}${w.error?'<p class="small muted">Trong sổ từ sai. Bản demo chưa mô phỏng điều kiện ra khỏi sổ.</p>':""}</div>${w.phase==="waiting"?`<form id="complete-form" data-id="${id}" class="stack" style="margin-top:20px"><label>Bổ sung nghĩa<input name="meaning" required maxlength="200" placeholder="Nhập nghĩa tiếng Việt"></label><button class="btn primary" type="submit">Lưu và chuyển sang Từ mới</button></form>`:""}`)}
document.addEventListener("click",e=>{
 const b=e.target.closest("[data-action]");if(!b||b.disabled)return;const a=b.dataset.action;
 if(a==="close"){$("#modal").close();return}if(a==="home")navigate("home");else if(a==="library")navigate("library","all");else if(a==="errors")navigate("library","error");else if(a==="filter")navigate("library",b.dataset.filter);
 else if(a==="topic"){state.scope=b.dataset.topic;render("h1")}else if(a==="review")start("review",state.game);else if(a==="practice")start("free",b.dataset.game);else if(a==="error-practice")start("errors","mix");
 else if(a==="resume")navigate("study");else if(a==="finish")finish();else if(a==="choose")submit(b.dataset.id);else if(a==="hint"){current().hint=true;render("#answer")}
 else if(a==="next"){if(state.session.i===state.session.queue.length-1)finish();else{state.session.i++;window.scrollTo(0,0);render(current().game==="typing"?"#answer":".prompt h1")}}
 else if(a==="add")addModal();else if(a==="detail")detail(Number(b.dataset.id));
});
document.addEventListener("change",e=>{if(e.target.id==="scope"){state.scope=e.target.value;render("#scope")}if(e.target.id==="game")state.game=e.target.value});
document.addEventListener("input",e=>{if(e.target.id==="answer")current().answer=e.target.value;if(e.target.id==="search"){state.query=e.target.value;$("#word-list").innerHTML=wordList();$("#list-count").textContent=`${filtered().length} thẻ trong phạm vi đã chọn`}});
document.addEventListener("submit",e=>{
 if(e.target.id==="answer-form"){e.preventDefault();submit($("#answer").value)}
 if(e.target.id==="add-form"){e.preventDefault();const data=new FormData(e.target),word=String(data.get("word")).trim(),meaning=String(data.get("meaning")).trim();if(!word){$("#form-error").textContent="Từ không được chỉ chứa khoảng trắng.";return}if(words.some(w=>normalize(w.word)===normalize(word)&&normalize(w.meaning)===normalize(meaning))){$("#form-error").textContent="Thẻ có cùng từ và nghĩa đã tồn tại.";return}words.push({id:Math.max(...words.map(w=>w.id))+1,word,meaning,type:String(data.get("type")),cat:String(data.get("cat")),phase:meaning?"new":"waiting"});$("#modal").close();state.scope=String(data.get("cat"));navigate("library",meaning?"new":"waiting");announce("Đã thêm thẻ trong phiên demo.")}
 if(e.target.id==="complete-form"){e.preventDefault();const meaning=String(new FormData(e.target).get("meaning")).trim();if(!meaning)return;const w=words.find(x=>x.id===Number(e.target.dataset.id));w.meaning=meaning;w.phase="new";$("#modal").close();navigate("library","new");announce("Đã bổ sung nghĩa. Thẻ được chuyển sang Từ mới.")}
});
$("#modal").addEventListener("click",e=>{if(e.target===$("#modal")){const r=$("#modal").getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$("#modal").close()}});
render();
</script>
</body>
</html>
